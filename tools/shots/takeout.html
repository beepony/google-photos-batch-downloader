<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Google Takeout</title>
  <style>
    body { margin: 0; width: 1100px; height: 720px; font-family: Arial, "PingFang SC", sans-serif; color: #202124; background: #fff; }
    header { height: 56px; border-bottom: 1px solid #e8eaed; display: flex; align-items: center; gap: 8px; padding: 0 24px; font-size: 20px; color: #5f6368; }
    header b { color: #4285f4; }
    main { padding: 24px 40px; max-width: 640px; }
    h2 { font-weight: 400; font-size: 24px; margin: 0 0 6px; }
    .sub { color: #5f6368; font-size: 14px; margin-bottom: 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eceff1; font-size: 15px; color: #3c4043; }
    .row a { font-size: 14px; color: #1a73e8; border: 1px solid #dadce0; border-radius: 4px; padding: 6px 16px; text-decoration: none; }
  </style>
</head>
<body>
  <header><b>G</b> Takeout</header>
  <main>
    <h2 id="h"></h2>
    <div class="sub" id="sub"></div>
    <div id="list"></div>
  </main>
  <script type="module">
    // A simplified "Manage exports" page; the real content script (extension/src/content.js) adds its panel.
    const q = location.search;
    await import(`/tools/shots/stub.js${q}`);
    const zh = new URLSearchParams(q).get('lang') === 'zh';
    document.getElementById('h').textContent = zh ? '下载您的文件' : 'Download your files';
    document.getElementById('sub').textContent = zh
      ? '导出数据共 166 个部分，这些文件将于 2026年10月25日 14:50 过期。'
      : 'Your export has 166 parts. These files expire on Oct 25, 2026.';
    const job = '0d5e7a11-c0de-4b2a-9e61-7a6e0a7c1234';
    document.getElementById('list').innerHTML = Array.from({ length: 9 }, (_, i) => {
      const n = i + 1;
      const label = zh ? `下载第 ${n} 部分（共 166 部分）` : `Download part ${n} of 166`;
      return `<div class="row"><span>${zh ? `第 ${n} 部分` : `Part ${n}`} · 2GB</span><a aria-label="${label}" href="https://takeout.google.com/takeout/download?j=${job}&i=${i}&user=1">${zh ? '下载' : 'Download'}</a></div>`;
    }).join('');
    const s = document.createElement('script');
    s.src = '/extension/src/content.js';
    document.body.appendChild(s);
  </script>
</body>
</html>
