<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Takeout Batch Downloader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.5 5 8.5 12l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Zm0 6v5m0 3v.01" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5m0-8v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2m-7 0 1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="appbar">
    <button id="back" class="icon-btn" hidden data-i18n-title="back" data-i18n-aria="back"><svg><use href="#i-back"/></svg></button>
    <img class="logo" src="../icons/icon32.png" alt="" width="24" height="24" />
    <h1 id="view-title" data-i18n="appName"></h1>
    <div class="lang-switch" role="group" aria-label="Language">
      <button data-lang="zh" lang="zh-CN">中</button><button data-lang="en" lang="en">EN</button>
    </div>
    <button id="gear" class="icon-btn" data-i18n-title="settings" data-i18n-aria="settings"><svg><use href="#i-gear"/></svg></button>
  </header>

  <div id="home" class="view">
    <main id="jobs"></main>

    <section id="empty" class="empty" hidden>
      <div class="empty-art" aria-hidden="true"><span></span><span></span><span></span></div>
      <h2 data-i18n="emptyTitle"></h2>
      <ol class="steps">
        <li data-i18n="emptyStep1"></li>
        <li data-i18n="emptyStep2"></li>
        <li data-i18n="emptyStep3"></li>
      </ol>
      <a class="btn filled" href="https://takeout.google.com/manage" target="_blank" rel="noopener"><span data-i18n="openTakeout"></span><svg><use href="#i-open"/></svg></a>
    </section>
  </div>

  <section id="settings" class="view settings" hidden>
    <h2 class="group-title" data-i18n="secDownload"></h2>
    <div class="group">
      <label class="row">
        <span class="row-text"><span class="row-label" data-i18n="concurrency"></span><span class="row-sub" data-i18n="concurrencySub"></span></span>
        <select id="s-concurrency"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
      </label>
      <div class="row stack">
        <label class="row-text" for="s-subfolder"><span class="row-label" data-i18n="saveFolder"></span><span class="row-sub" data-i18n="saveFolderSub"></span></label>
        <div class="inline">
          <input id="s-subfolder" type="text" placeholder="Google Takeout" spellcheck="false" />
          <button id="s-open-dir" class="btn tonal" type="button"><svg><use href="#i-folder"/></svg><span data-i18n="openDownloadDir"></span></button>
        </div>
      </div>
      <label class="row">
        <span class="row-text"><span class="row-label" data-i18n="budget"></span><span class="row-sub" data-i18n="budgetHint"></span></span>
        <span class="unit-input"><input id="s-budget" type="number" min="0" step="1" inputmode="numeric" /><span>GB</span></span>
      </label>
      <button id="s-chrome-dl" class="row link" type="button">
        <span class="row-text"><span class="row-label" data-i18n="chromeDownloads"></span><span class="row-sub" data-i18n="externalDriveHint"></span></span>
        <svg class="chev"><use href="#i-open"/></svg>
      </button>
    </div>

    <h2 class="group-title" data-i18n="secSchedule"></h2>
    <div class="group">
      <label class="row">
        <span class="row-text"><span class="row-label" data-i18n="windowOnly"></span><span class="row-sub" data-i18n="windowSub"></span></span>
        <input id="s-window" class="switch" type="checkbox" role="switch" />
      </label>
      <div class="row sub-row" id="window-times">
        <span class="row-label muted" data-i18n="windowFrom"></span>
        <span class="inline times"><input id="s-wstart" type="time" /><span>–</span><input id="s-wend" type="time" /></span>
      </div>
      <label class="row">
        <span class="row-text"><span class="row-label" data-i18n="keepAwake"></span></span>
        <input id="s-awake" class="switch" type="checkbox" role="switch" />
      </label>
    </div>

    <h2 class="group-title" data-i18n="secGeneral"></h2>
    <div class="group">
      <label class="row">
        <span class="row-text"><span class="row-label" data-i18n="notify"></span></span>
        <input id="s-notify" class="switch" type="checkbox" role="switch" />
      </label>
      <label class="row">
        <span class="row-text"><span class="row-label" data-i18n="language"></span></span>
        <select id="s-language"><option value="auto" data-i18n="langAuto"></option><option value="zh">中文</option><option value="en">English</option></select>
      </label>
    </div>
    <p class="footnote"><span data-i18n="privacyNote"></span> · v<span id="version"></span></p>
  </section>

  <template id="job-tpl">
    <article class="job">
      <div class="job-head">
        <div class="job-id">
          <h2 class="job-title"></h2>
          <p class="job-sub"></p>
        </div>
        <span class="chip"></span>
      </div>

      <div class="progress">
        <div class="progress-top">
          <span class="big"><b class="pct">0</b>%</span>
          <span class="progress-note st-parts"></span>
        </div>
        <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div>
      </div>

      <dl class="stats">
        <div><dt data-i18n="statDownloaded"></dt><dd class="st-bytes"></dd></div>
        <div><dt data-i18n="statSpeed"></dt><dd class="st-speed"></dd></div>
        <div><dt data-i18n="statEta"></dt><dd class="st-eta"></dd></div>
      </dl>

      <div class="alert" role="status" hidden><svg><use href="#i-alert"/></svg><p class="notice"></p></div>

      <div class="actions">
        <button class="btn filled act-main"></button>
        <button class="btn outlined act-retry" hidden data-i18n="btnRetryFailed"></button>
      </div>

      <details class="parts">
        <summary><span data-i18n="partsHeading"></span><span class="parts-count"></span><svg class="chev"><use href="#i-chev"/></svg></summary>
        <div class="grid" role="list"></div>
        <div class="legend"><i class="lg done"></i><span data-i18n="legendDone"></span><i class="lg active"></i><span data-i18n="legendActive"></span><i class="lg retry"></i><span data-i18n="legendRetry"></span><i class="lg failed"></i><span data-i18n="legendFailed"></span><i class="lg pending"></i><span data-i18n="legendPending"></span></div>
      </details>

      <details class="more">
        <summary><span data-i18n="more"></span><svg class="chev"><use href="#i-chev"/></svg></summary>
        <div class="menu">
          <button class="menu-item act-folder"><svg><use href="#i-folder"/></svg><span data-i18n="openFolder"></span></button>
          <button class="menu-item act-page"><svg><use href="#i-open"/></svg><span data-i18n="openPage"></span></button>
          <button class="menu-item act-verify"><svg><use href="#i-check"/></svg><span data-i18n="exportVerify"></span></button>
          <button class="menu-item act-manifest"><svg><use href="#i-list"/></svg><span data-i18n="exportManifest"></span></button>
          <p class="hint verify-hint"></p>
          <div class="ranges">
            <input class="range-input" data-i18n-placeholder="rangePlaceholder" />
            <button class="btn text act-mark" data-i18n="markHave"></button>
            <button class="btn text act-redo" data-i18n="redownload"></button>
          </div>
          <button class="menu-item danger act-remove"><svg><use href="#i-trash"/></svg><span data-i18n="removeJob"></span></button>
        </div>
      </details>
    </article>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
